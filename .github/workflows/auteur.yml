name: Auteur Security Check
on:
  pull_request:
    branches: [ main ]

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Auteur Check
        uses: stythelad/auteur@v0.6.0
        with:
          base-ref: ${{ github.base_ref }}
          auteur-version: 'v0.6.0'
