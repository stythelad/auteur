name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux,  goarch: amd64, suffix: linux-amd64}
          - {goos: linux,  goarch: arm64, suffix: linux-arm64}
          - {goos: darwin, goarch: amd64, suffix: darwin-amd64}
          - {goos: darwin, goarch: arm64, suffix: darwin-arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o sentinel-${GOOS}-${GOARCH} ./cmd/sentinel
          tar czf sentinel-${{ matrix.suffix }}.tar.gz sentinel-${GOOS}-${GOARCH}
      - uses: softprops/action-gh-release@v2
        with:
          files: sentinel-${{ matrix.suffix }}.tar.gz
          generate_release_notes: true
