name: 'Auteur Provenance Check'
description: 'Enforce AI provenance policies on pull requests'
branding:
  icon: 'shield'
  color: 'purple'
runs:
  using: 'composite'
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    
    - name: Install Auteur
      shell: bash
      run: go install github.com/stythelad/auteur/cmd/auteur@latest
    
    - name: Run Auteur Check
      shell: bash
      run: auteur check --pr-base ${{ github.base_ref }}
